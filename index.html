<html lang="en">
<head>
<meta charset="UTF-8">

<title>Blinkart MasterCode</title>
<style>
:root{--primary:#ff6600;--accent:#fff200;--bg:#fff9d6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,sans-serif;background:linear-gradient(180deg,#fff9d6 0%,#ffffff 100%);color:#111;padding-bottom:120px;}
#loadingScreen{position:fixed;inset:0;background:var(--accent);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99999;transition:.3s;}
.loader-logo{font-size:55px;font-weight:900;color:var(--primary);}
.spinner{width:65px;height:65px;margin-top:20px;border:6px solid white;border-top:6px solid var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}
.offline-screen{position:fixed;inset:0;background:rgba(0,0,0,.85);color:white;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px;z-index:100000;}
.offline-screen div{max-width:480px;}
.offline-screen strong{display:block;font-size:28px;margin-bottom:12px;}
#notification{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:#111;color:white;padding:12px 24px;border-radius:30px;font-weight:bold;transition:.4s;z-index:9999;border:2px solid var(--primary);}
#notification.show{transform:translateX(-50%) translateY(0);}
header{background:var(--accent);padding:15px;position:sticky;top:0;z-index:999;border-bottom:4px solid var(--primary);}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.logo{font-size:34px;font-weight:900;color:var(--primary);}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.action-btn{background:white;padding:10px 16px;border-radius:30px;font-weight:bold;border:2px solid var(--primary);cursor:pointer;position:relative;display:flex;align-items:center;gap:8px;}
.badge{position:absolute;top:-8px;right:-8px;background:red;color:white;font-size:10px;padding:2px 6px;border-radius:50%;display:none;}
.search-box{margin-top:12px;}
.search-box input{width:100%;padding:13px;border-radius:10px;border:2px solid var(--primary);font-size:15px;outline:none;}
.category-title{background:#fff0b0;margin:18px 15px 10px;padding:12px;font-size:20px;font-weight:bold;border-left:6px solid var(--primary);border-radius:10px;}
.container{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;padding:0 15px 20px;}
.card{background:white;border:2px solid var(--primary);border-radius:18px;padding:15px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.08);display:flex;flex-direction:column;justify-content:space-between;}
.card h4{min-height:48px;font-size:15px;margin-bottom:10px;}
.product-img{width:100%;height:140px;object-fit:contain;border-radius:14px;background:#f8f2d7;margin-bottom:10px;}
.price{font-size:20px;font-weight:bold;color:var(--primary);margin-bottom:10px;}
.btn-group{display:flex;gap:6px;}
.add-btn{flex:2;background:var(--primary);color:white;border:none;padding:10px 8px;border-radius:10px;font-weight:bold;cursor:pointer;}
.remove-btn{flex:1;background:#ddd;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
.remove-btn.active{background:red;color:white;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:9999;}
.modal-content{background:white;width:92%;max-width:520px;padding:20px;border-radius:18px;border:3px solid var(--primary);max-height:85vh;overflow:auto;}
.modal-content h2{margin-bottom:15px;color:var(--primary);}
.cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #ccc;}
.total{margin-top:15px;font-size:22px;font-weight:bold;text-align:right;color:var(--primary);}
.modal-buttons{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.modal-buttons button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
.close-btn{background:#ddd;}
.order-btn{background:var(--primary);color:white;}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px;border:2px solid var(--primary);border-radius:10px;}
#chatgptButton{position:fixed;bottom:20px;right:20px;width:90px;height:90px;border-radius:50%;background:#111;color:white;display:flex;justify-content:center;align-items:center;font-size:16px;font-weight:bold;cursor:pointer;z-index:99999;border:4px solid #00ff99;box-shadow:0 0 20px #00ff99;text-align:center;line-height:1.1;}
body.dark{background:#111;color:white;}
body.dark .card,body.dark .modal-content,body.dark .action-btn,body.dark .search-box input{background:#1f1f1f;color:white;}
body.dark .category-title{background:#333;color:white;}
body.dark header{background:#292922;}
body.dark .action-btn{background:#222;border-color:#00ff99;}
body.dark .add-btn{background:#00b894;}
body.dark .remove-btn{background:#444;color:white;}
body.dark .search-box input{border-color:#00ff99;}
#lockScreen{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;justify-content:center;align-items:center;z-index:100001;padding:20px;}
#lockScreen.show{display:flex;}
#lockScreen .lock-content{width:100%;max-width:420px;background:#111;color:white;border:3px solid #00ff99;border-radius:20px;padding:24px;box-shadow:0 0 40px rgba(0,0,0,.6);text-align:center;}
#lockScreen .lock-content h2{margin-bottom:18px;font-size:24px;color:#00ff99;}
#lockScreen .lock-content input{width:100%;margin:10px 0;padding:14px 16px;border-radius:14px;border:2px solid #00ff99;background:#222;color:white;font-size:16px;outline:none;}
#lockScreen .lock-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
#lockScreen .lock-buttons button{flex:1;padding:12px 14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;}
#lockScreen .lock-buttons .primary{background:#00ff99;color:#111;}
#lockScreen .lock-buttons .secondary{background:#333;color:white;border:2px solid #00ff99;}
#lockScreen .lock-buttons .secondary:hover{background:#444;}
#lockScreen .lock-hint{margin-top:14px;font-size:14px;color:#ccc;}
#passwordBtn, #backupBtn {display:none;}
#passwordBtn.active, #backupBtn.active {display:inline-block;}
</style>
</head>
<body>
<div id="loadingScreen">
<div class="loader-logo">🛒 Blinkart</div>
<div class="spinner"></div>
</div>
<div id="notification">Welcome to Blinkart</div>
<div id="lockScreen">
<div class="lock-content">
<h2 id="lockTitle">Set App Password</h2>
<input type="password" id="passwordInput" placeholder="Enter password">
<input type="password" id="passwordConfirmInput" placeholder="Confirm password" style="display:none;">
<div class="lock-buttons">
<button class="primary" id="lockActionBtn" onclick="handleLockAction()">Save password</button>
<button class="secondary" id="lockCancelBtn" onclick="cancelPasswordSetup()" style="display:none;">Cancel</button>
<button class="secondary" id="forgotPasswordBtn" onclick="forgotPassword()" style="display:none;">🔄 Forgot?</button>
</div>
<div class="lock-hint" id="lockHint">Create a password to protect your app.</div>
</div>
</div>
<div id="chatgptButton" onclick="openAIHelper()">AI</div>
<header>
<div class="header-top">
<div class="logo">🛒 Blinkart</div>
<div class="actions">
<div class="action-btn" onclick="sendAlertEmail()">⚠️ Alert</div>
<div class="action-btn" onclick="openCart()">🛍️ Cart (<span id="cartCount">0</span>)<span class="badge" id="badge">0</span></div>
<div class="action-btn" onclick="openSettings()">⚙️ Settings</div>
</div>
</div>
<div class="search-box"><input type="text" id="searchInput" placeholder="Search Products"></div>
</header>
<div id="main"></div>
<div class="modal" id="cartModal">
<div class="modal-content">
<h2>🛒 Your Cart</h2>
<div id="cartItems"></div>
<div class="total" id="totalBill">₹0</div>
<div class="modal-buttons">
<button class="close-btn" onclick="closeCart()">Close</button>
<button class="order-btn" onclick="placeOrder()">Order</button>
</div>
</div>
</div>
<div class="modal" id="settingsModal">
<div class="modal-content">
<h2>⚙️ Settings</h2>
<div class="setting-row"><span>🌙 Dark Mode</span><button onclick="toggleDarkMode()" id="darkBtn">OFF</button></div>
<div class="setting-row"><span>🔔 Notifications</span><button onclick="toggleNotifications()" id="notifyBtn">ON</button></div>
<div class="setting-row"><span>🛒 Clear Cart</span><button onclick="clearCart()">CLEAR</button></div>
<div class="setting-row"><span>🔒 App Password</span><button onclick="preparePasswordChange()" id="passwordBtn">CHANGE</button></div>
<div class="setting-row"><span>📱 Backup Password</span><button onclick="setupBackupPassword()" id="backupBtn">ADD</button></div>
<div class="modal-buttons"><button class="close-btn" onclick="closeSettings()">Close</button></div>
</div>
</div>

function setPasswordButtonLabel(){ const pwdBtn = document.getElementById('passwordBtn'); const backupBtn = document.getElementById('backupBtn'); if(pwdBtn){ if(getStoredPassword()){ pwdBtn.classList.add('active'); pwdBtn.innerText='CHANGE'; } else { pwdBtn.classList.remove('active'); } } if(backupBtn){ if(getStoredPassword()){ backupBtn.classList.add('active'); backupBtn.innerText = getBackupPassword() ? 'CHANGE' : 'ADD'; } else { backupBtn.classList.remove('active'); } } }
function showLockScreen(mode){ currentLockMode = mode; const lockScreen = document.getElementById('lockScreen'); const title = document.getElementById('lockTitle'); const passwordInputEl = document.getElementById('passwordInput'); const confirmInput = document.getElementById('passwordConfirmInput'); const actionBtn = document.getElementById('lockActionBtn'); const cancelBtn = document.getElementById('lockCancelBtn'); const forgotBtn = document.getElementById('forgotPasswordBtn'); const hint = document.getElementById('lockHint'); if(!lockScreen || !title || !actionBtn || !hint || !passwordInputEl || !confirmInput) return; lockScreen.classList.add('show'); lockScreen.style.display='flex'; document.body.style.overflow='hidden'; passwordInputEl.value = ''; if(mode==='set'){ title.innerText='🔐 Set App Password'; confirmInput.style.display='block'; actionBtn.innerText='Save password'; actionBtn.className='primary'; cancelBtn.style.display='none'; forgotBtn.style.display='none'; hint.innerText='Choose at least 4 characters to protect your Blinkart app.'; }
else if(mode==='unlock'){ title.innerText='🔓 Unlock Blinkart'; confirmInput.style.display='none'; actionBtn.innerText='Unlock'; actionBtn.className='primary'; cancelBtn.style.display='none'; forgotBtn.style.display=getStoredPassword()?'inline-flex':'none'; hint.innerText='Enter your password to continue shopping.'; }

else if(mode==='setupBackup'){ title.innerText='📱 Setup Backup Password'; confirmInput.style.display='block'; actionBtn.innerText='Save Backup'; actionBtn.className='secondary'; cancelBtn.style.display='inline-flex'; forgotBtn.style.display='none'; hint.innerText='For other devices (min 4 characters).'; }
passwordInputEl.focus(); }
function hideLockScreen(){ const lockScreen = document.getElementById('lockScreen'); if(lockScreen){ lockScreen.classList.remove('show'); lockScreen.style.display='none'; document.body.style.overflow='auto'; } isSessionUnlocked = true; }
async function hashPassword(password){ const data = new TextEncoder().encode(password); const hashBuffer = await crypto.subtle.digest('SHA-256', data); const hashArray = Array.from(new Uint8Array(hashBuffer)); return hashArray.map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function verifyPassword(input){ const stored = getStoredPassword(); const backup = getBackupPassword(); if(!stored) return false; const hashed = await hashPassword(input); return hashed === stored || (backup && hashed === backup); }
function hideLockScreen(){ const lockScreen = document.getElementById('lockScreen'); if(lockScreen){ lockScreen.classList.remove('show'); lockScreen.style.display='none'; document.body.style.overflow='auto'; } }
async function hashPassword(password){ const data = new TextEncoder().encode(password); const hashBuffer = await crypto.subtle.digest('SHA-256', data); const hashArray = Array.from(new Uint8Array(hashBuffer)); return hashArray.map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function verifyPassword(input){ const stored = getStoredPassword(); if(!stored) return false; const hashed = await hashPassword(input); return hashed === stored; }
async function handleLockAction(){ const passwordInputEl = document.getElementById('passwordInput'); const passwordConfirmEl = document.getElementById('passwordConfirmInput'); if(!passwordInputEl || !passwordConfirmEl) return; if(currentLockMode==='unlock'){ const valid = await verifyPassword(passwordInputEl.value); if(valid){ hideLockScreen(); showNotification('🔓 App unlocked'); } else { showNotification('❌ Incorrect password'); passwordInputEl.value=''; passwordInputEl.focus(); } }
else if(currentLockMode==='change'){ const valid = await verifyPassword(passwordInputEl.value); if(valid){ showLockScreen('set'); } else { showNotification('❌ Incorrect current password'); passwordInputEl.value=''; passwordInputEl.focus(); } }
else if(currentLockMode==='setupBackup'){ const pass = passwordInputEl.value.trim(); const passConfirm = passwordConfirmEl.value.trim(); if(pass.length < 4){ showNotification('⚠️ Use at least 4 characters'); return; } if(pass !== passConfirm){ showNotification('⚠️ Passwords do not match'); return; } const hashed = await hashPassword(pass); localStorage.setItem(backupPasswordKey, hashed); showNotification('✅ Backup password saved'); showLockScreen('unlock'); }
else { const pass = passwordInputEl.value.trim(); const passConfirm = passwordConfirmEl.value.trim(); if(pass.length < 4){ showNotification('⚠️ Use at least 4 characters'); return; } if(pass !== passConfirm){ showNotification('⚠️ Passwords do not match'); return; } const hashed = await hashPassword(pass); localStorage.setItem(appPasswordKey, hashed); setPasswordButtonLabel(); hideLockScreen(); showNotification('✅ Password saved'); setTimeout(()=>{ showNotification('💡 Tip: Set backup password in Settings'); },2000); } }
function cancelPasswordSetup(){ if(getStoredPassword()){ showLockScreen('unlock'); } else { hideLockScreen(); showNotification('Password setup cancelled'); } }
function forgotPassword(){ if(!confirm('⚠️ Reset will clear your password. Continue?')) return; const newPass = prompt('🆕 Enter new password (min 4 chars):'); if(!newPass || newPass.trim().length < 4){ showNotification('Password must be at least 4 characters'); return; } hashPassword(newPass.trim()).then(hashed=>{ localStorage.setItem(appPasswordKey, hashed); localStorage.removeItem(backupPasswordKey); showNotification('✅ Password reset successfully'); showLockScreen('unlock'); }); }
function setupBackupPassword(){ closeSettings(); showLockScreen('setupBackup'); }
function preparePasswordChange(){ closeSettings(); if(getStoredPassword()){ showLockScreen('change'); } else { showLockScreen('set'); } }
function initLockScreen(){ setPasswordButtonLabel(); if(getStoredPassword()){ showLockScreen('unlock'); } else { showLockScreen('set'); } }

let cart = [];
let notifications = true;
function openAIHelper(){ showNotification('🤖 Opening ChatGPT'); setTimeout(()=>{ window.open('https://chat.openai.com','_blank'); },300); }
function sendAlertEmail(){ const subject = 'Blinkart Alert'; const body = 'Hello Blinkart team,%0A%0APlease review the alert from the Blinkart site.%0A%0AThanks.'; window.location.href = `mailto:${emailAddress}?subject=${encodeURIComponent(subject)}&body=${body}`; showNotification('📧 Alert email opening'); }
function sendOrderEmail(total){ const subject = 'Blinkart Order Notification'; const body = encodeURIComponent(`New order placed on Blinkart. Total ₹${total}. Items: ${cart.map(item=>item.name).join(', ')}.`); window.location.href = `mailto:${emailAddress}?subject=${subject}&body=${body}`; }
function showNotification(text){ if(!notifications) return; const box = document.getElementById('notification'); box.innerText = text; box.classList.add('show'); setTimeout(()=>{ box.classList.remove('show'); },2200); }
function render(filter=''){ const main = document.getElementById('main'); main.innerHTML = ''; for(const category in inventory){ const items = inventory[category].filter(product=>product.name.toLowerCase().includes(filter.toLowerCase())); if(items.length>0){ main.innerHTML += `<div class="category-title">${category}</div>`; let html = '<div class="container">'; items.forEach(product=>{ const count = cart.filter(i=>i.name===product.name).length; html += `<div class="card"><img class="product-img" src="${product.img}" alt="${product.name}" loading="lazy"><h4>${product.name}</h4><div class="price">₹${product.price}</div><div class="btn-group"><button class="add-btn" onclick="addItem('${product.name}',${product.price})">+ Add ${count?`(${count})`:''}</button><button class="remove-btn ${count>0?'active':''}" onclick="removeItem('${product.name}')">-</button></div></div>`; }); html += '</div>'; main.innerHTML += html; } } }
function addItem(name,price){ cart.push({name,price}); updateCart(); showNotification(`+ ${name} added`); render(document.getElementById('searchInput').value); }
function removeItem(name){ const index = cart.findIndex(item=>item.name===name); if(index !== -1){ cart.splice(index,1); updateCart(); showNotification(`- ${name} removed`); render(document.getElementById('searchInput').value); } }
function updateCart(){ document.getElementById('cartCount').innerText = cart.length; const badge = document.getElementById('badge'); badge.innerText = cart.length; badge.style.display = cart.length>0 ? 'block' : 'none'; }
function openCart(){ if(cart.length===0){ showNotification('⚠️ Cart is empty'); return; } const list = document.getElementById('cartItems'); list.innerHTML = ''; let total = 0; cart.forEach(item=>{ total += item.price; list.innerHTML += `<div class="cart-item"><span>${item.name}</span><span>₹${item.price}</span></div>`; }); document.getElementById('totalBill').innerText = 'Total : ₹' + total; document.getElementById('cartModal').style.display = 'flex'; }
function closeCart(){ document.getElementById('cartModal').style.display = 'none'; }
function placeOrder(){ if(cart.length===0){ showNotification('⚠️ Add items to cart first'); return; } const total = cart.reduce((sum,item)=>sum+item.price,0); sendOrderEmail(total); alert('🎉 Order placed. Email window opened for confirmation.'); cart=[]; updateCart(); render(document.getElementById('searchInput').value); closeCart(); }
function openSettings(){ document.getElementById('settingsModal').style.display = 'flex'; }
function closeSettings(){ document.getElementById('settingsModal').style.display = 'none'; }
function toggleDarkMode(){ document.body.classList.toggle('dark'); document.getElementById('darkBtn').innerText = document.body.classList.contains('dark') ? 'ON' : 'OFF'; }
function toggleNotifications(){ notifications = !notifications; document.getElementById('notifyBtn').innerText = notifications ? 'ON' : 'OFF'; showNotification(notifications ? 'Notifications enabled' : 'Notifications disabled'); }
function clearCart(){ cart=[]; updateCart(); render(document.getElementById('searchInput').value); showNotification('🧹 Cart cleared'); }
document.getElementById('searchInput').oninput = (event)=> render(event.target.value);
window.onload = ()=>{ setTimeout(()=>{ document.getElementById('loadingScreen').style.opacity = '0'; setTimeout(()=>{ document.getElementById('loadingScreen').style.display = 'none'; },250); },500); render(); initLockScreen(); };
