<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinkart MasterCode</title>
<style>
:root{--primary:#ff6600;--accent:#fff200;--bg:#fff9d6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,sans-serif;background:linear-gradient(180deg,#fff9d6 0%,#ffffff 100%);color:#111;padding-bottom:120px;}
#loadingScreen{position:fixed;inset:0;background:var(--accent);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99999;transition:.3s;}
.loader-logo{font-size:55px;font-weight:900;color:var(--primary);}
.spinner{width:65px;height:65px;margin-top:20px;border:6px solid white;border-top:6px solid var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}
#notification{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:#111;color:white;padding:12px 24px;border-radius:30px;font-weight:bold;transition:.4s;z-index:9999;border:2px solid var(--primary);}
#notification.show{transform:translateX(-50%) translateY(0);}
header{background:var(--accent);padding:15px;position:sticky;top:0;z-index:999;border-bottom:4px solid var(--primary);}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.logo{font-size:34px;font-weight:900;color:var(--primary);}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.action-btn{background:white;padding:10px 16px;border-radius:30px;font-weight:bold;border:2px solid var(--primary);cursor:pointer;position:relative;display:flex;align-items:center;gap:8px;}
.badge{position:absolute;top:-8px;right:-8px;background:red;color:white;font-size:10px;padding:2px 6px;border-radius:50%;display:none;}
.search-box{margin-top:12px;}
.search-box input{width:100%;padding:13px;border-radius:10px;border:2px solid var(--primary);font-size:15px;outline:none;}
.category-title{background:#fff0b0;margin:18px 15px 10px;padding:12px;font-size:20px;font-weight:bold;border-left:6px solid var(--primary);border-radius:10px;}
.container{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;padding:0 15px 20px;}
.card{background:white;border:2px solid var(--primary);border-radius:18px;padding:15px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.08);display:flex;flex-direction:column;justify-content:space-between;}
.card h4{min-height:48px;font-size:15px;margin-bottom:10px;}
.product-img{width:100%;height:140px;object-fit:contain;border-radius:14px;background:#f8f2d7;margin-bottom:10px;}
.price{font-size:20px;font-weight:bold;color:var(--primary);margin-bottom:5px;}
.handling-note{font-size:11px;color:#666;margin-bottom:10px;}
.btn-group{display:flex;gap:6px;}
.add-btn{flex:2;background:var(--primary);color:white;border:none;padding:10px 8px;border-radius:10px;font-weight:bold;cursor:pointer;}
.remove-btn{flex:1;background:#ddd;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
.remove-btn.active{background:red;color:white;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:9999;}
.modal-content{background:white;width:92%;max-width:520px;padding:20px;border-radius:18px;border:3px solid var(--primary);max-height:85vh;overflow:auto;}
.modal-content h2{margin-bottom:15px;color:var(--primary);}
.cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #ccc;}
.cart-item .item-details{text-align:left;}
.cart-item .item-name{font-weight:bold;}
.cart-item .item-breakdown{font-size:12px;color:#666;}
.summary-section{background:#f9f9f9;padding:15px;border-radius:12px;margin-top:15px;}
.summary-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;}
.summary-row.total{font-size:20px;font-weight:bold;color:var(--primary);border-top:2px solid var(--primary);padding-top:10px;margin-top:10px;}
.customer-form{margin-top:20px;padding-top:15px;border-top:2px dashed #ccc;}
.customer-form h3{margin-bottom:12px;color:#333;font-size:16px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:13px;font-weight:bold;margin-bottom:4px;color:#555;}
.form-group input,.form-group textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:14px;outline:none;transition:.2s;}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary);}
.form-group textarea{resize:vertical;min-height:60px;}
.modal-buttons{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.modal-buttons button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
.close-btn{background:#ddd;}
.order-btn{background:var(--primary);color:white;}
.order-btn:disabled{background:#ccc;cursor:not-allowed;}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px;border:2px solid var(--primary);border-radius:10px;}
#chatgptButton{position:fixed;bottom:20px;right:20px;width:90px;height:90px;border-radius:50%;background:#111;color:white;display:flex;justify-content:center;align-items:center;font-size:16px;font-weight:bold;cursor:pointer;z-index:99999;border:4px solid #00ff99;box-shadow:0 0 20px #00ff99;text-align:center;line-height:1.1;}
body.dark{background:#111;color:white;}
body.dark .card,body.dark .modal-content,body.dark .action-btn,body.dark .search-box input{background:#1f1f1f;color:white;}
body.dark .category-title{background:#333;color:white;}
body.dark header{background:#292922;}
body.dark .action-btn{background:#222;border-color:#00ff99;}
body.dark .add-btn{background:#00b894;}
body.dark .remove-btn{background:#444;color:white;}
body.dark .search-box input{border-color:#00ff99;}
body.dark .summary-section{background:#2a2a2a;}
body.dark .form-group input,body.dark .form-group textarea{background:#333;border-color:#444;color:white;}
body.dark .customer-form h3{color:#fff;}
body.dark .form-group label{color:#ccc;}
</style>
</head>
<body>
<div id="loadingScreen">
<div class="loader-logo">🛒 Blinkart</div>
<div class="spinner"></div>
</div>
<div id="notification">Welcome to Blinkart</div>
<div id="chatgptButton" onclick="openAIHelper()">AI</div>
<header>
<div class="header-top">
<div class="logo">🛒 Blinkart</div>
<div class="actions">
<div class="action-btn" onclick="sendAlertEmail()">⚠️ Alert</div>
<div class="action-btn" onclick="openCart()">🛍️ Cart (<span id="cartCount">0</span>)<span class="badge" id="badge">0</span></div>
<div class="action-btn" onclick="openSettings()">⚙️ Settings</div>
</div>
</div>
<div class="search-box"><input type="text" id="searchInput" placeholder="Search Products"></div>
</header>
<div id="main"></div>

<div class="modal" id="cartModal">
<div class="modal-content">
<h2>🛒 Your Cart</h2>
<div id="cartItems"></div>
<div class="summary-section">
<div class="summary-row"><span>Subtotal</span><span id="subtotalAmount">₹0</span></div>
<div class="summary-row"><span>Handling Charges (₹2 × items)</span><span id="handlingAmount">₹0</span></div>
<div class="summary-row total"><span>Total</span><span id="totalBill">₹0</span></div>
</div>
<div class="customer-form">
<h3>📦 Delivery Details</h3>
<div class="form-group">
<label>Full Name *</label>
<input type="text" id="customerName" placeholder="Enter your full name">
</div>
<div class="form-group">
<label>Email *</label>
<input type="email" id="customerEmail" placeholder="Enter your email">
</div>
<div class="form-group">
<label>Phone Number *</label>
<input type="tel" id="customerPhone" placeholder="Enter 10-digit phone number">
</div>
<div class="form-group">
<label>Delivery Address *</label>
<textarea id="customerAddress" placeholder="Enter complete delivery address"></textarea>
</div>
</div>
<div class="modal-buttons">
<button class="close-btn" onclick="closeCart()">Close</button>
<button class="order-btn" id="orderBtn" onclick="placeOrder()">Place Order</button>
</div>
</div>
</div>

<div class="modal" id="settingsModal">
<div class="modal-content">
<h2>⚙️ Settings</h2>
<div class="setting-row"><span>🌙 Dark Mode</span><button onclick="toggleDarkMode()" id="darkBtn">OFF</button></div>
<div class="setting-row"><span>🔔 Notifications</span><button onclick="toggleNotifications()" id="notifyBtn">ON</button></div>
<div class="setting-row"><span>🛒 Clear Cart</span><button onclick="clearCart()">CLEAR</button></div>
<div class="modal-buttons"><button class="close-btn" onclick="closeSettings()">Close</button></div>
</div>
</div>

let cart = {};
let notificationsEnabled = true;

window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        document.getElementById('loadingScreen').style.opacity = '0';
        setTimeout(() => document.getElementById('loadingScreen').style.display = 'none', 300);
    }, 800);
    renderShop();
    setupFormValidation();
});

function showNotification(msg) {
    if (!notificationsEnabled) return;
    const banner = document.getElementById('notification');
    banner.innerText = msg;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 2500);
}

function renderShop(filterTerm = "") {
    const mainDiv = document.getElementById('main');
    mainDiv.innerHTML = "";
    
    for (const category in inventory) {
        const filteredItems = inventory[category].filter(item => 
            item.name.toLowerCase().includes(filterTerm.toLowerCase())
        );
        
        if (filteredItems.length === 0) continue;

        const catTitle = document.createElement('div');
        catTitle.className = 'category-title';
        catTitle.innerText = category;
        mainDiv.appendChild(catTitle);

        const container = document.createElement('div');
        container.className = 'container';

        filteredItems.forEach(item => {
            const qty = cart[item.name] ? cart[item.name].qty : 0;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <img class="product-img" src="${item.img}" alt="${item.name}" onerror="this.src='https://placehold.co/150?text=No+Image'">
                    <h4>${item.name}</h4>
                </div>
                <div>
                    <div class="price">₹${item.price}</div>
                    <div class="handling-note">+₹${HANDLING_CHARGE} handling charge</div>
                    <div class="btn-group">
                        <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">
                            ${qty > 0 ? `Add (${qty})` : 'Add To Cart'}
                        </button>
                        <button class="remove-btn ${qty > 0 ? 'active' : ''}" onclick="removeFromCart('${item.name}')">×</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
        mainDiv.appendChild(container);
    }
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    renderShop(e.target.value);
});

function addToCart(name, price) {
    if (cart[name]) {
        cart[name].qty++;
    } else {
        cart[name] = { price: price, qty: 1 };
    }
    updateCartDOM();
    renderShop(document.getElementById('searchInput').value);
    showNotification(`Added ${name} to cart!`);
}

function removeFromCart(name) {
    if (!cart[name]) return;
    cart[name].qty--;
    if (cart[name].qty <= 0) {
        delete cart[name];
    }
    updateCartDOM();
    renderShop(document.getElementById('searchInput').value);
    showNotification(`Removed item from cart.`);
}

function clearCart() {
    cart = {};
    updateCartDOM();
    renderShop();
    showNotification("Cart completely cleared!");
    closeSettings();
}

function updateCartDOM() {
    let count = 0;
    let subtotal = 0;
    const cartItemsDiv = document.getElementById('cartItems');
    cartItemsDiv.innerHTML = "";

    for (const name in cart) {
        count += cart[name].qty;
        const totalItemCost = cart[name].price * cart[name].qty;
        subtotal += totalItemCost;

        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
            <div class="item-details">
                <div class="item-name">${name}</div>
                <div class="item-breakdown">₹${cart[name].price} × ${cart[name].qty}</div>
            </div>
            <div style="font-weight:bold; align-self: center;">₹${totalItemCost}</div>
        `;
        cartItemsDiv.appendChild(row);
    }

    const handlingTotal = count * HANDLING_CHARGE;
    const totalBill = subtotal + handlingTotal;

    document.getElementById('cartCount').innerText = count;
    const badge = document.getElementById('badge');
    if(count > 0) {
        badge.innerText = count;
        badge.style.display = 'block';
    } else {
        badge.style.display = 'none';
        cartItemsDiv.innerHTML = "<p style='text-align:center;color:#666;padding:20px 0;'>Your cart is empty.</p>";
    }

    document.getElementById('subtotalAmount').innerText = `₹${subtotal}`;
    document.getElementById('handlingAmount').innerText = `₹${handlingTotal}`;
    document.getElementById('totalBill').innerText = `₹${totalBill}`;
    
    validateForm();
}

function openCart() { document.getElementById('cartModal').style.display = 'flex'; }
function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

function setupFormValidation() {
    const inputs = ['customerName', 'customerEmail', 'customerPhone', 'customerAddress'];
    inputs.forEach(id => document.getElementById(id).addEventListener('input', validateForm));
}

function validateForm() {
    const name = document.getElementById('customerName').value.trim();
    const email = document.getElementById('customerEmail').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const address = document.getElementById('customerAddress').value.trim();
    const hasItems = Object.keys(cart).length > 0;

    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const phoneValid = /^\d{10}$/.test(phone);

    document.getElementById('orderBtn').disabled = !(name && emailValid && phoneValid && address && hasItems);
}

function placeOrder() {
    const name = document.getElementById('customerName').value.trim();
    alert(`Thank you, ${name}! Your order has been registered successfully.`);
    cart = {};
    updateCartDOM();
    renderShop();
    closeCart();
}

function sendAlertEmail() {
    window.location.href = `mailto:${emailAddress}?subject=Blinkart%20Alert&body=Emergency%20or%20Alert%20Triggered%20from%20Store%20Front.`;
}

function openAIHelper() {
    alert("AI Assistant Module initialized! How can I help you navigate your stationary products today?");
}

function toggleDarkMode() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('darkBtn').innerText = isDark ? "ON" : "OFF";
    document.getElementById('darkBtn').style.background = isDark ? "#00ff99" : "#ddd";
}

function toggleNotifications() {
    notificationsEnabled = !notificationsEnabled;
    document.getElementById('notifyBtn').innerText = notificationsEnabled ? "ON" : "OFF";
    document.getElementById('notifyBtn').style.background = notificationsEnabled ? "#ff6600" : "#ddd";
    document.getElementById('notifyBtn').style.color = notificationsEnabled ? "white" : "black";
}
</script>
