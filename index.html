<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blinkart MasterCode</title>

<style>

:root{
--primary:#ff6600;
--accent:#fff200;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,sans-serif;
background:#fff;
padding-bottom:120px;
}

/* LOADING */

#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:var(--accent);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
transition:.3s;
}

.loader-logo{
font-size:55px;
font-weight:900;
color:var(--primary);
}

.spinner{
width:65px;
height:65px;
margin-top:20px;
border:6px solid white;
border-top:6px solid var(--primary);
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* HEADER */

header{
background:var(--accent);
padding:15px;
position:sticky;
top:0;
z-index:999;
border-bottom:4px solid var(--primary);
}

.header-top{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

.logo{
font-size:34px;
font-weight:900;
color:var(--primary);
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.action-btn{
background:white;
padding:10px 16px;
border-radius:30px;
font-weight:bold;
border:2px solid var(--primary);
cursor:pointer;
position:relative;
}

.badge{
position:absolute;
top:-8px;
right:-8px;
background:red;
color:white;
font-size:10px;
padding:2px 6px;
border-radius:50%;
display:none;
}

/* SEARCH */

.search-box{
margin-top:12px;
}

.search-box input{
width:100%;
padding:13px;
border-radius:10px;
border:2px solid var(--primary);
font-size:15px;
outline:none;
}

/* CATEGORY */

.category-title{
background:#fff0b0;
margin:18px 15px 10px;
padding:12px;
font-size:20px;
font-weight:bold;
border-left:6px solid var(--primary);
border-radius:10px;
}

/* PRODUCTS */

.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:15px;
padding:0 15px;
}

.card{
background:white;
border:2px solid var(--primary);
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.card h4{
height:45px;
font-size:15px;
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:bold;
color:var(--primary);
margin-bottom:10px;
}

/* BUTTONS */

.btn-group{
display:flex;
gap:6px;
}

.add-btn{
flex:2;
background:var(--primary);
color:white;
border:none;
padding:10px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.remove-btn{
flex:1;
background:#ddd;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.remove-btn.active{
background:red;
color:white;
}

/* NOTIFICATION */

#notification{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%) translateY(-100px);
background:#111;
color:white;
padding:12px 24px;
border-radius:30px;
font-weight:bold;
transition:.4s;
z-index:9999;
border:2px solid var(--primary);
}

#notification.show{
transform:translateX(-50%) translateY(0);
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.modal-content{
background:white;
width:92%;
max-width:420px;
padding:20px;
border-radius:15px;
border:3px solid var(--primary);
max-height:85vh;
overflow:auto;
}

.modal-content h2{
margin-bottom:15px;
color:var(--primary);
}

.cart-item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px dashed #ccc;
}

.total{
margin-top:15px;
font-size:22px;
font-weight:bold;
text-align:right;
color:var(--primary);
}

.modal-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.modal-buttons button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.close-btn{
background:#ddd;
}

.order-btn{
background:var(--primary);
color:white;
}

/* SETTINGS */

.setting-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
padding:12px;
border:2px solid var(--primary);
border-radius:10px;
}

/* AI BUTTON */

#chatgptButton{
position:fixed;
bottom:20px;
right:20px;
width:75px;
height:75px;
border-radius:50%;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
font-weight:bold;
cursor:pointer;
z-index:99999;
border:4px solid #00ff99;
box-shadow:0 0 20px #00ff99;
}

/* DARK MODE */

body.dark{
background:#111;
color:white;
}

body.dark .card,
body.dark .modal-content,
body.dark .action-btn,
body.dark .search-box input{
background:#1f1f1f;
color:white;
}

body.dark .category-title{
background:#333;
color:white;
}

</style>
</head>

<body>

<!-- LOADING -->

<div id="loadingScreen">

<div class="loader-logo">
🛒 Blinkart
</div>

<div class="spinner"></div>

</div>

<!-- NOTIFICATION -->

<div id="notification">
Welcome
</div>

<!-- AI BUTTON -->

<div id="chatgptButton"
onclick="openAIHelper()">
AI
</div>

<!-- HEADER -->

<header>

<div class="header-top">

<div class="logo">
🛒 Blinkart
</div>

<div class="actions">

<div class="action-btn"
onclick="showNotification('🛒 Welcome To Blinkart')">
🔔 Notice
<span class="badge" id="badge">0</span>
</div>

<div class="action-btn"
onclick="openCart()">
🛍️ Cart (<span id="cartCount">0</span>)
</div>

<div class="action-btn"
onclick="openSettings()">
⚙️ Settings
</div>

</div>

</div>

<div class="search-box">
<input type="text"
id="searchInput"
placeholder="Search Products">
</div>

</header>

<!-- PRODUCTS -->

<div id="main"></div>

<!-- CART -->

<div class="modal" id="cartModal">

<div class="modal-content">

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<div class="total" id="totalBill">
₹0
</div>

<div class="modal-buttons">

<button class="close-btn"
onclick="closeCart()">
Close
</button>

<button class="order-btn"
onclick="placeOrder()">
Order
</button>

</div>

</div>

</div>

<!-- SETTINGS -->

<div class="modal" id="settingsModal">

<div class="modal-content">

<h2>⚙️ Settings</h2>

<div class="setting-row">
<span>🌙 Dark Mode</span>
<button onclick="toggleDarkMode()"
id="darkBtn">
OFF
</button>
</div>

<div class="setting-row">
<span>🔔 Notifications</span>
<button onclick="toggleNotifications()"
id="notifyBtn">
ON
</button>
</div>

<div class="setting-row">
<span>🛒 Clear Cart</span>
<button onclick="clearCart()">
CLEAR
</button>
</div>

<div class="modal-buttons">

<button class="close-btn"
onclick="closeSettings()">
Close
</button>

</div>

</div>

</div>

<script>

/* INVENTORY */

const inventory={

"Premium Pens":[
{name:"Parker",price:2000},
{name:"Perie Cardian",price:449},
{name:"Trimax Gold",price:120},
{name:"Trimax",price:60},
{name:"Pilot v7",price:60},
{name:"Pilot v5",price:67},
{name:"Pilot Hitectpoint",price:55},
{name:"Calligraphy Pen",price:55}
],

"Budget Pens":[
{name:"Jotex Gel Pen",price:40},
{name:"Octane Fountain",price:40},
{name:"Jeter Ballpoint Pens",price:32},
{name:"Writo Meter Gel",price:25},
{name:"Classmate Octane Ball",price:10},
{name:"Flair Move Gel",price:10},
{name:"Hauser XO Ball",price:10},
{name:"Linc Ocean Gel",price:10}
],

"Kits & Sets":[
{name:"Art Kit",price:1000},
{name:"Stationery Kit",price:150},
{name:"Stationery Kit Small",price:50}
],

"Pencils & Mechanical":[
{name:"Apsara Princess Pencils",price:90},
{name:"Doms Groove",price:65},
{name:"Apsara Platinum",price:50},
{name:"Natraj Bold",price:50},
{name:"Flair Penpencil 0.7",price:20}
],

"Colors & Art":[
{name:"Fabric Colour",price:400},
{name:"Brush Pen",price:200},
{name:"Luxor Pastel",price:125},
{name:"Sketch Pens",price:40},
{name:"Water Colour",price:20},
{name:"Crayons",price:10}
],

"Essentials":[
{name:"Science Calculator",price:500},
{name:"Calculator",price:670},
{name:"Origami Paper",price:20},
{name:"Stencil",price:15},
{name:"Pocket Diary",price:10},
{name:"Scale",price:5},
{name:"Eraser",price:5},
{name:"Sharpner",price:5},
{name:"Stapler",price:100},
{name:"Stapler Pins",price:12},
{name:"Keychains",price:110}
]

};

let cart=[];
let notifications=true;

/* AI BUTTON */

function openAIHelper(){

showNotification("🤖 Opening ChatGPT");

setTimeout(()=>{

window.open("https://chatgpt.com","_blank");

},500);

}

/* NOTIFICATION */

function showNotification(text){

if(!notifications) return;

const box=document.getElementById("notification");

box.innerText=text;

box.classList.add("show");

setTimeout(()=>{
box.classList.remove("show");
},2000);

}

/* RENDER */

function render(filter=""){

const main=document.getElementById("main");

main.innerHTML="";

for(const cat in inventory){

const items=inventory[cat].filter(p=>
p.name.toLowerCase().includes(filter.toLowerCase())
);

if(items.length>0){

main.innerHTML+=`
<div class="category-title">${cat}</div>
`;

let html='<div class="container">';

items.forEach(p=>{

const count=
cart.filter(i=>i.name===p.name).length;

html+=`

<div class="card">

<h4>${p.name}</h4>

<div class="price">
₹${p.price}
</div>

<div class="btn-group">

<button class="add-btn"
onclick="addItem('${p.name}',${p.price})">
Add (${count})
</button>

<button class="remove-btn ${count>0?'active':''}"
onclick="removeItem('${p.name}')">
-
</button>

</div>

</div>

`;

});

html+='</div>';

main.innerHTML+=html;

}

}

}

/* ADD */

function addItem(name,price){

cart.push({name,price});

updateCart();

showNotification("🛒 "+name+" Added");

render(document.getElementById("searchInput").value);

}

/* REMOVE */

function removeItem(name){

const index=
cart.findIndex(i=>i.name===name);

if(index!==-1){

cart.splice(index,1);

updateCart();

showNotification("❌ "+name+" Removed");

render(document.getElementById("searchInput").value);

}

}

/* UPDATE CART */

function updateCart(){

document.getElementById("cartCount").innerText=
cart.length;

document.getElementById("badge").innerText=
cart.length;

document.getElementById("badge").style.display=
cart.length>0?"block":"none";

}

/* OPEN CART */

function openCart(){

if(cart.length===0){

showNotification("⚠️ Cart Empty");

return;

}

const list=
document.getElementById("cartItems");

list.innerHTML="";

let total=0;

cart.forEach(item=>{

total+=item.price;

list.innerHTML+=`

<div class="cart-item">
<span>${item.name}</span>
<span>₹${item.price}</span>
</div>

`;

});

document.getElementById("totalBill")
.innerText="Total : ₹"+total;

document.getElementById("cartModal")
.style.display="flex";

}

/* CLOSE CART */

function closeCart(){

document.getElementById("cartModal")
.style.display="none";

}

/* ORDER */

function placeOrder(){

alert("🎉 Order Placed Successfully");

cart=[];

updateCart();

render();

closeCart();

}

/* SETTINGS */

function openSettings(){

document.getElementById("settingsModal")
.style.display="flex";

}

function closeSettings(){

document.getElementById("settingsModal")
.style.display="none";

}

function toggleDarkMode(){

document.body.classList.toggle("dark");

document.getElementById("darkBtn")
.innerText=
document.body.classList.contains("dark")
?"ON":"OFF";

}

function toggleNotifications(){

notifications=!notifications;

document.getElementById("notifyBtn")
.innerText=
notifications?"ON":"OFF";

}

function clearCart(){

cart=[];

updateCart();

render();

showNotification("🛒 Cart Cleared");

}

/* SEARCH */

document.getElementById("searchInput")
.oninput=(e)=>render(e.target.value);

/* START */

window.onload=()=>{

setTimeout(()=>{

document.getElementById("loadingScreen")
.style.opacity="0";

setTimeout(()=>{

document.getElementById("loadingScreen")
.style.display="none";

},200);

},400);

render();

};

</script>

</body>
</html>
