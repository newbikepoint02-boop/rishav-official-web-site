<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinkart Wholesale Store</title>

<style>

:root{
--primary:#ff6600;
--accent:#fff200;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:white;
padding-bottom:40px;
}

/* LOADING SCREEN */

#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:var(--accent);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
transition:0.4s;
}

.loader-logo{
font-size:45px;
font-weight:800;
color:var(--primary);
margin-bottom:20px;
}

.spinner{
width:60px;
height:60px;
border:6px solid white;
border-top:6px solid var(--primary);
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* HEADER */

header{
background:var(--accent);
padding:15px;
position:sticky;
top:0;
z-index:1000;
border-bottom:3px solid var(--primary);
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.header-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
flex-wrap:wrap;
}

.logo{
font-size:30px;
font-weight:800;
color:var(--primary);
}

.top-nav-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.nav-item{
background:white;
padding:8px 14px;
border-radius:20px;
font-size:14px;
font-weight:bold;
cursor:pointer;
position:relative;
border:2px solid var(--primary);
}

.badge{
position:absolute;
top:-8px;
right:-8px;
background:red;
color:white;
padding:2px 6px;
border-radius:50%;
font-size:10px;
display:none;
}

/* SEARCH */

.search-box input{
width:100%;
padding:12px;
border-radius:10px;
border:2px solid var(--primary);
font-size:15px;
outline:none;
}

/* SALE */

#saleBanner{
background:#ff3300;
color:white;
text-align:center;
padding:12px;
font-weight:bold;
font-size:16px;
border-top:2px solid var(--primary);
border-bottom:2px solid var(--primary);
}

/* NOTIFICATION */

#appNotification{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%) translateY(-100px);
background:#222;
color:white;
padding:12px 25px;
border-radius:30px;
font-weight:bold;
transition:0.4s;
z-index:9999;
border:2px solid var(--primary);
}

#appNotification.show{
transform:translateX(-50%) translateY(0);
}

/* CATEGORY */

.category-title{
background:#fff4b3;
padding:12px 20px;
font-size:20px;
font-weight:bold;
border-left:6px solid var(--primary);
margin:25px 15px 15px;
border-radius:6px;
}

/* PRODUCTS */

.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:15px;
padding:0 15px;
}

.card{
background:white;
border-radius:14px;
padding:14px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
text-align:center;
border:2px solid var(--primary);
}

.card h4{
font-size:15px;
height:40px;
margin-bottom:10px;
}

.price-old{
text-decoration:line-through;
color:#777;
font-size:12px;
}

.price-new{
display:block;
font-size:20px;
font-weight:bold;
color:var(--primary);
margin:8px 0;
}

.btn-group{
display:flex;
gap:6px;
}

.add-btn{
flex:2;
background:var(--primary);
color:white;
border:none;
padding:9px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.remove-btn{
flex:1;
background:#ddd;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.remove-btn.active{
background:red;
color:white;
}

/* CHECKOUT */

.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
z-index:5000;
}

.modal-content{
background:white;
padding:20px;
border-radius:15px;
width:92%;
max-width:420px;
max-height:85vh;
overflow-y:auto;
border:3px solid var(--primary);
}

.form-group{
margin-bottom:12px;
}

.form-group input,
.form-group textarea{
width:100%;
padding:10px;
border-radius:8px;
border:2px solid var(--primary);
}

.submit-btn,
.close-btn{
padding:10px 14px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.submit-btn{
background:var(--primary);
color:white;
}

.close-btn{
background:#ddd;
}

</style>
</head>

<body>

<!-- LOADING -->

<div id="loadingScreen">

<div class="loader-logo">
🛒 Blinkart
</div>

<div class="spinner"></div>

<p style="margin-top:15px;font-weight:bold;color:#444;">
Loading Blinkart Store...
</p>

</div>

<!-- NOTIFICATION -->

<div id="appNotification">
Notification
</div>

<!-- HEADER -->

<header>

<div class="header-top">

<div class="logo">
🛒 Blinkart
</div>

<div class="top-nav-actions">

<div class="nav-item"
onclick="showInlineNotification('☀️ Summer Sale Active | 2.5% OFF')">

🔔 Alert
<span class="badge" id="nBadge">0</span>

</div>

<div class="nav-item"
onclick="checkout()">

🛍️ Cart (<span id="cCount">0</span>)

</div>

</div>

</div>

<div class="search-box">

<input type="text"
id="findInput"
placeholder="Search Products...">

</div>

</header>

<!-- SALE -->

<div id="saleBanner">
☀️ SUMMER SALE 17 MAY — 25 MAY | 2.5% OFF ☀️
</div>

<!-- PRODUCTS -->

<div id="main-content"></div>

<!-- CHECKOUT -->

<div class="modal-overlay" id="checkoutModal">

<div class="modal-content">

<h3 style="color:#ff6600;margin-bottom:15px;">
🛍️ Blinkart Checkout
</h3>

<div id="cartItemsList"></div>

<div style="margin-top:15px;font-weight:bold;color:#ff6600;" id="cartTotalBill">
Total: ₹0
</div>

<br>

<div class="form-group">
<input type="text" id="custName" placeholder="Full Name">
</div>

<div class="form-group">
<input type="tel" id="custPhone" placeholder="Mobile Number">
</div>

<div class="form-group">
<textarea rows="3" id="custAddress" placeholder="Delivery Address"></textarea>
</div>

<button class="submit-btn" onclick="submitOrder()">
Place Order
</button>

<button class="close-btn" onclick="closeModal()">
Close
</button>

</div>

</div>

<script>

/* FULL STATIONERY MASTER LIST */

const inventory={

"Premium Pens":[
{name:"Parker",price:2000},
{name:"Perie Cardian",price:449},
{name:"Trimax Gold",price:120},
{name:"Trimax",price:60},
{name:"Pilot v7",price:60},
{name:"Pilot v5",price:67},
{name:"Pilot Hitectpoint",price:55},
{name:"Pilot v2",price:20},
{name:"Fountain Pen",price:60}
],

"Budget Pens":[
{name:"Jotex Gel Pen",price:40},
{name:"Octane Fountain",price:40},
{name:"Jeter Ballpoint Pens",price:32},
{name:"Writo Meter Gel",price:25},
{name:"Writo Meter Silky Ball",price:20},
{name:"Classmate Octane Ball",price:10},
{name:"Unomax Ultron Ball",price:10},
{name:"Unomax Geltron",price:10},
{name:"Unomax Pearl Ball",price:10},
{name:"Unomax Pearl Gel",price:10},
{name:"Doms Inxo",price:10},
{name:"Flair Breeze Ball",price:10},
{name:"Flair Move Gel",price:10},
{name:"Classmate Octane Gel",price:10},
{name:"Hauser XO Ball",price:10},
{name:"Doms Inxon",price:10},
{name:"Hauser XO Gel",price:10},
{name:"Doms Inxify Ball",price:5},
{name:"Doms Inxify Gel",price:5},
{name:"Supra His Ball",price:10},
{name:"Linc Ocean Gel",price:10}
],

"Pencils & Mechanical":[
{name:"Apsara Princess",price:90},
{name:"Doms Groove",price:65},
{name:"Apsara Spacekids",price:60},
{name:"Doms Xi",price:50},
{name:"Apsara Platinum",price:50},
{name:"Natraj Bold",price:50},
{name:"Flair Penpencil 0.7",price:20},
{name:"Hauser 2.0 Penpencil",price:20},
{name:"Flair Penpencil 2.0",price:10},
{name:"Rynolds 0.5",price:6}
],

"Colours & Art":[
{name:"Fabric Colour",price:400},
{name:"Brush Pen",price:200},
{name:"Luxor Pastel",price:125},
{name:"Luxor Flouroscent",price:100},
{name:"Doms Colour Pencils",price:60},
{name:"Drawing Pencils",price:50},
{name:"Paint Brush",price:50},
{name:"Sketch Pens",price:40},
{name:"Water Colour",price:20},
{name:"Crayons",price:10}
],

"Essentials":[
{name:"Science Calculator",price:500},
{name:"Calculator",price:670},
{name:"Origami Paper",price:20},
{name:"Stencil",price:15},
{name:"Pocket Diary",price:10},
{name:"Gliters",price:10},
{name:"Scale",price:5},
{name:"Eraser",price:5},
{name:"Sharpner",price:5}
],

"Kits & Sets":[
{name:"Art Kit",price:1000},
{name:"Stationery Kit",price:150},
{name:"Stationery Kit Small",price:50}
]

};

let cart=[];

/* NOTIFICATION */

function showInlineNotification(text){

const banner=document.getElementById("appNotification");

banner.innerText=text;

banner.classList.add("show");

setTimeout(()=>{
banner.classList.remove("show");
},3000);
}

/* SALE */

function getSalePrice(price){

return Math.round(price - (price*2.5/100));
}

/* RENDER */

function render(filter=""){

const main=document.getElementById("main-content");

main.innerHTML="";

for(const cat in inventory){

const filteredItems=
inventory[cat].filter(p=>
p.name.toLowerCase().includes(filter.toLowerCase())
);

if(filteredItems.length>0){

main.innerHTML+=
`<div class="category-title">${cat}</div>`;

let gridHTML='<div class="container">';

filteredItems.forEach(p=>{

let finalPrice=getSalePrice(p.price);

const count=
cart.filter(item=>item.name===p.name).length;

const removable=
count>0?"active":"";

gridHTML+=`

<div class="card">

<h4>${p.name}</h4>

<span class="price-old">₹${p.price}</span>
<span class="price-new">₹${finalPrice}</span>

<div class="btn-group">

<button class="add-btn"
onclick="add('${p.name}',${finalPrice})">

Add (${count})

</button>

<button class="remove-btn ${removable}"
onclick="removeOne('${p.name}')">

-

</button>

</div>

</div>
`;
});

gridHTML+='</div>';

main.innerHTML+=gridHTML;
}
}
}

/* ADD */

function add(name,price){

cart.push({name,price});

updateCartUI();

showInlineNotification("🛒 "+name+" added");

render(document.getElementById("findInput").value);
}

/* REMOVE */

function removeOne(name){

const index=
cart.findLastIndex(item=>item.name===name);

if(index!==-1){

cart.splice(index,1);

updateCartUI();

showInlineNotification("❌ "+name+" removed");

render(document.getElementById("findInput").value);
}
}

/* CART */

function updateCartUI(){

document.getElementById("cCount").innerText=
cart.length;

document.getElementById("nBadge").innerText=
cart.length;

document.getElementById("nBadge").style.display=
cart.length>0?"block":"none";
}

/* CHECKOUT */

function checkout(){

if(cart.length===0){

showInlineNotification("⚠️ Cart Empty");

return;
}

const listDiv=
document.getElementById("cartItemsList");

listDiv.innerHTML="";

let total=0;

cart.forEach(item=>{

total+=item.price;

listDiv.innerHTML+=`
<div style="display:flex;justify-content:space-between;padding:8px 0;">
<span>${item.name}</span>
<span>₹${item.price}</span>
</div>
`;
});

document.getElementById("cartTotalBill")
.innerText="Total Bill: ₹"+total;

document.getElementById("checkoutModal")
.style.display="flex";
}

/* CLOSE */

function closeModal(){

document.getElementById("checkoutModal")
.style.display="none";
}

/* EMAIL ORDER */

function submitOrder(){

const name=
document.getElementById("custName").value;

const phone=
document.getElementById("custPhone").value;

const address=
document.getElementById("custAddress").value;

if(!name || !phone || !address){

alert("Fill all details");

return;
}

let total=0;
let products="";

cart.forEach((item,index)=>{

total+=item.price;

products +=
(index+1)+". "+item.name+
" - ₹"+item.price+"\n";

});

const subject=
encodeURIComponent("New Blinkart Order");

const body=
encodeURIComponent(
"Customer: "+name+"\n"+
"Phone: "+phone+"\n"+
"Address: "+address+"\n\n"+
"Products:\n"+products+
"\nTotal Bill: ₹"+total
);

window.location.href=
"mailto:newbikepoint02@gmail.com?subject="+subject+"&body="+body;

alert("✅ Order Ready In Email");

cart=[];

updateCartUI();

render();

closeModal();
}

/* SEARCH */

document.getElementById("findInput")
.oninput=(e)=>render(e.target.value);

/* START */

window.onload=()=>{

setTimeout(()=>{

document.getElementById("loadingScreen")
.style.opacity="0";

setTimeout(()=>{
document.getElementById("loadingScreen")
.style.display="none";
},400);

},2200);

render();
};

</script>

</body>
</html>
